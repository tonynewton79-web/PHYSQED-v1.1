name: PHYSQED v0.6 Adversarial Benchmark (Scope Only)
on:
  push:
    paths:
      - 'projects/physqed/**'
      - '.github/workflows/physqed-v06-benchmark.yml'
  pull_request:
    paths:
      - 'projects/physqed/**'
      - '.github/workflows/physqed-v06-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-claim-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned SymPy for inherited audits
        run: python -m pip install sympy==1.14.0
      - name: Run 174+ inherited and new regression tests
        run: python -m unittest discover -s projects/physqed/tests -v
      - name: Run 120-case independent expected-label adversarial suite
        run: python projects/physqed/benchmarks/adversarial_v06.py /tmp/physqed-adversarial-v06.json
      - name: Scope guard - false physical claims cannot be promoted to physics proofs
        run: |
          python - <<'PY'
          import json
          with open('/tmp/physqed-adversarial-v06.json') as f: r=json.load(f)
          assert r['total']==120 and r['scope_correct']==120
          assert r['per_class']['semantic_drift']['total']==20
          assert r['semantic_drift_detected']==0
          assert r['competing_systems_run'] is False
          PY
      - name: Challenge signed reviewer claim anchors and scope escalation
        run: python projects/physqed/benchmarks/semantic_anchor_v06.py /tmp/physqed-semantic-anchor-v06.json
      - name: Refuse generalized NLP certification from exact matching
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/physqed-semantic-anchor-v06.json'))
          assert r['reference_pairs_accepted']==20
          assert r['deliberately_false_english_refused']==20
          assert r['mutations_refused']==r['mutations_total']==6
          assert r['free_text_semantic_detection_demonstrated'] is False
          assert r['physical_law_proven'] is False
          PY
      - name: Independent source-backed toy method replay
        run: python projects/physqed/independent_v05_audit.py
      - name: Confirm no paper-specific data entered the general engine
        run: python projects/physqed/standalone_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: physqed-v06-120-case-adversarial-scope
          path: |
            /tmp/physqed-adversarial-v06.json
            /tmp/physqed-semantic-anchor-v06.json
          if-no-files-found: error
