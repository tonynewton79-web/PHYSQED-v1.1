name: PHYSQED v1.2 physics-backend certificates

on:
  push:
    paths:
      - "projects/physqed/v12/**"
      - "projects/physqed/tests/test_physics_v12*.py"
      - ".github/workflows/physqed-v12.yml"
  pull_request:
    paths:
      - "projects/physqed/v12/**"
      - "projects/physqed/tests/test_physics_v12*.py"
      - ".github/workflows/physqed-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-exact:
    name: Python 3.15.2 textbook checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Confirm interpreter (security-patched release)
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3,15,2), sys.version"
      - name: Install exact-symbolic dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Standard GR/gauge/quantum/QFT/canonical and refusal cases
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12.py' -v
      - name: Independent standard-library arithmetic oracle
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_oracle.py' -v
      - name: Independent exact tensor 2-jet oracle
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_jet_oracle.py' -v
      - name: Coupled Einstein-Maxwell positive and negative controls
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_einstein_maxwell.py' -v
      - name: Spherical conservation trigonometric exactness and refusal
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_trig.py' -v
      - name: Typed coupled Einstein-Maxwell/ADM contracts (isolated SymPy processes)
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_valid_einstein_maxwell_full_linked_contract \
            test_wrong_coupling_fails_dynamics_but_not_geometry_bridge \
            test_wrong_cosmological_constant \
            test_declared_inconsistent_stress \
            test_nonclosed_declared_field_is_detected \
            test_wrong_claimed_constraints_refused \
            test_wrong_lapse_raises_not_green \
            test_wrong_signature_witness_refused \
            test_offshell_codazzi_bridge_nontrivial \
            test_matter_noether_bridge_offshell_maxwell; do
            python -m unittest discover -s projects/physqed/tests \
              -p 'test_physics_v12_contract.py' -k "$test" -v
          done
      - name: Reproducible standard-physics receipts
        run: |
          PYTHONPATH=projects/physqed python -m v12.benchmarks --out-dir /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python -m v12.contract_benchmark --out-dir /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python -m v12.coupled_benchmark \
            --output /tmp/physqed-v12-receipts/STD-GR-EM-RN-001.json \
            --negative-output /tmp/physqed-v12-receipts/STD-GR-EM-RN-NEG.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physqed-v12-standard-receipts
          path: /tmp/physqed-v12-receipts
          if-no-files-found: warn
      - name: Existing legacy engine regression
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_engine.py' -v
      - name: Compile all new Python modules
        run: |
          python -m compileall -q projects/physqed/v12

