name: PHYSQED v1.2 physics-backend certificates

on:
  push:
    paths:
      - "projects/physqed/v12/**"
      - "projects/physqed/tests/test_physics_v12*.py"
      - ".github/workflows/physqed-v12.yml"
  pull_request:
    paths:
      - "projects/physqed/v12/**"
      - "projects/physqed/tests/test_physics_v12*.py"
      - ".github/workflows/physqed-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physqed-v12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physics-exact:
    name: Python 3.15.2 textbook checks
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Confirm interpreter (security-patched release)
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3,15,2), sys.version"
      - name: Syntax-check new backend before importing physics tests
        run: |
          python -m compileall -q projects/physqed/v12
          python -m compileall -q projects/physqed/tests/test_physics_v12*.py
      - name: Install exact-symbolic dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Independent Fraction frozen periodic ADM constraint-energy gate
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_frozen_energy.py' -v
          mkdir -p /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python - <<'PY'
          from fractions import Fraction as F
          from pathlib import Path
          import json
          from v12.frozen_energy import audit_frozen_adm
          h=[[2,F(1,3),0],[F(1,3),3,0],[0,0,F(5,4)]]
          receipt=audit_frozen_adm(h,F(3,2),[F(1,5),-F(2,7),F(1,9)])
          assert receipt['status']=='PASS_FROZEN_PERIODIC_CONSTRAINT_ENERGY_ALGEBRA'
          assert receipt['all_three_principal_symbols_symmetrized']
          assert not receipt['global_einstein_solution_proven']
          Path('/tmp/physqed-v12-receipts/frozen_adm_energy.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: Variable-coefficient ADM energy-balance and scope gate
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_variable_energy.py' -v
      - name: Replay exact variable-coefficient energy receipts and reject tampering
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_energy_receipts.py' -v
      - name: Exact rational Bernstein domain-wide energy inequality gates
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_domain_energy.py' -v
          mkdir -p /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python - <<'PY'
          from pathlib import Path
          import json
          import sympy as S
          from v12.domain_energy import certify_domain_energy
          t,x=S.symbols("t x")
          receipt=certify_domain_energy(
              (t,x),{t:(0,1),x:(0,1)},
              S.diag(1+t,2+t),[S.diag(1,2)],S.zeros(2),
              coercivity=1,growth=2,
              boundary="periodic_solution_assumed")
          assert receipt["status"]=="PASS_INTERIOR_DOMAIN_BOUNDS__PDE_HYPOTHESES_PENDING"
          assert receipt["coercivity_bound_proved"] and receipt["growth_bound_proved"]
          assert not receipt["underlying_smooth_solution_existence_proven"]
          Path('/tmp/physqed-v12-receipts/domain_energy.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Exact rational-function ADM domain and denominator sign gates
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_rational_energy.py' -v
          mkdir -p /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python - <<'PY'
          import json
          from pathlib import Path
          import sympy as S
          from v12.variable_energy import adm_constraint_matrices
          from v12.rational_energy import certify_rational_domain_energy, replay_rational_domain_energy
          t,x,y,z=S.symbols('t x y z')
          Sm,A,B=adm_constraint_matrices((t,x,y,z),S.diag(1+t,1,1),1+t,
                                          [S.Rational(1,5),0,0])
          box={t:(0,1),x:(0,1),y:(0,1),z:(0,1)}
          options={'coercivity':1,'growth':0,
                   'denominator_guards':[1+t],
                   'original_expression_denominators_complete':True,
                   'boundary':'periodic_solution_assumed'}
          r=certify_rational_domain_energy((t,x,y,z),box,Sm,A,B,**options)
          assert r['status']=='PASS_RATIONAL_INTERIOR_BOUNDS__PDE_HYPOTHESES_PENDING'
          assert r['all_received_coefficient_denominators_certified']
          assert r['all_required_original_denominator_guards_certified']
          assert replay_rational_domain_energy((t,x,y,z),box,Sm,A,B,r,**options)
          assert not r['boundary_flux_control_proven']
          assert not r['global_Einstein_Cauchy_theorem_proven']
          Path('/tmp/physqed-v12-receipts/rational_adm_energy.json').write_text(
              json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - name: Typed source-preserving ADM geometry and six-face energy flux
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_typed_adm_domain.py' -v
          mkdir -p /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python -m v12.adm_domain_cli \
            --input projects/physqed/examples/typed/adm_domain_outgoing_flux.json \
            --output /tmp/physqed-v12-receipts/typed_adm_domain_flux.json
          set +e
          PYTHONPATH=projects/physqed python -m v12.adm_domain_cli \
            --input projects/physqed/examples/typed/adm_domain_hidden_pole.json \
            --output /tmp/physqed-v12-receipts/typed_adm_domain_hidden_pole.json
          pole_status=$?
          PYTHONPATH=projects/physqed python -m v12.adm_domain_cli \
            --input projects/physqed/examples/typed/adm_domain_incoming_flux.json \
            --output /tmp/physqed-v12-receipts/typed_adm_domain_incoming_flux.json
          incoming_status=$?
          set -e
          test "$pole_status" -eq 2
          test "$incoming_status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/physqed-v12-receipts')
          good=json.loads((root/'typed_adm_domain_flux.json').read_text())
          assert good['status']=='PASS_INTERIOR_AND_CONDITIONAL_BOUNDARY_ALGEBRA__PDE_ASSUMPTIONS_PENDING'
          assert good['all_source_guards_certified']
          assert good['geometric_bounds']['passed']
          assert good['interior_domain_bounds_proven']
          assert len(good['boundary_flux']['faces'])==6
          assert all(face['passed'] for face in good['boundary_flux']['faces'])
          assert not good['boundary_trace_conditions_satisfied_by_solution_proven']
          assert not good['global_constraint_propagation_theorem_proven']
          pole=json.loads((root/'typed_adm_domain_hidden_pole.json').read_text())
          assert not pole['all_source_guards_certified']
          incoming=json.loads((root/'typed_adm_domain_incoming_flux.json').read_text())
          assert not incoming['conditional_boundary_flux_algebra_proven']
          PY
      - name: Linked Einstein-Maxwell 18-node and maximal nonnegative constraint boundaries
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            test_explicit_shifted_vacuum_solution_and_maximal_flux_faces \
            test_undercomplete_positive_flux_is_not_maximal \
            test_source_mismatch_rejected_before_any_field_claim \
            test_unconserved_maxwell_stress_prevents_joint_pass \
            test_incoming_trace_flux_rejects_joint_contract \
            test_rank_deficient_three_column_face \
            test_hidden_original_metric_pole_not_accepted \
            test_cancelled_electromagnetic_source_pole_refused \
            test_negative_growth_declaration_refused \
            test_periodic_assumption_does_not_prove_frame_compatibility \
            test_tampered_receipt_replay_and_changed_input \
            test_characteristic_zero_speed_faces_are_not_called_noncharacteristic; do
            python -m unittest discover -s projects/physqed/tests \
              -p 'test_physics_v12_linked_adm_boundary.py' -k "$name" -v
          done
      - name: Linked exact shifted vacuum domain CLI and adversarial boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/physqed-v12-receipts/linked_adm
          PYTHONPATH=projects/physqed python -m v12.linked_adm_cli \
            --input projects/physqed/examples/typed/linked_adm_shifted_minkowski.json \
            --output /tmp/physqed-v12-receipts/linked_adm/vacuum.json
          set +e
          PYTHONPATH=projects/physqed python -m v12.linked_adm_cli \
            --input projects/physqed/examples/typed/linked_adm_undercomplete_boundary.json \
            --output /tmp/physqed-v12-receipts/linked_adm/undercomplete.json
          bad_boundary=$?
          PYTHONPATH=projects/physqed python -m v12.linked_adm_cli \
            --input projects/physqed/examples/typed/linked_adm_unconserved_matter.json \
            --output /tmp/physqed-v12-receipts/linked_adm/nonconserved.json
          bad_matter=$?
          set -e
          test "$bad_boundary" -eq 2
          test "$bad_matter" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/physqed-v12-receipts/linked_adm')
          good=json.loads((p/'vacuum.json').read_text())
          assert good['status']=='PASS_LINKED_EXACT_MODEL_AND_CONDITIONAL_CONSTRAINT_ENERGY'
          assert len(good['field_contract']['shifted_contract']['nodes'])==18
          assert good['maximal_nonnegative_constraint_trace_spaces_passed']
          assert good['uniform_interior_energy_bounds_passed']
          assert not good['nonlinear_Einstein_IBVP_well_posedness_proven']
          under=json.loads((p/'undercomplete.json').read_text())
          assert under['all_face_flux_forms_passed']
          assert not under['maximal_nonnegative_constraint_trace_spaces_passed']
          matter=json.loads((p/'nonconserved.json').read_text())
          assert not matter['all_18_field_nodes_passed']
          PY
      - name: Shifted Maxwell Gauss and moving-boundary energy positive controls
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_maxwell_ibvp_control.py' -v
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_linked_maxwell_ibvp.py' -v
          mkdir -p /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python - <<'PY'
          import json
          from pathlib import Path
          from v12.maxwell_ibvp_control import verify_maxwell_shifted_boundary
          from v12.linked_maxwell_ibvp import verify_linked_maxwell_positive_control
          receipt=verify_maxwell_shifted_boundary('1/5')
          assert receipt['status']=='PASS_EXACT_SHIFTED_MAXWELL_BOUNDARY_ALGEBRA'
          assert len(receipt['boundary_faces'])==6
          assert all(f['passed'] for f in receipt['boundary_faces'])
          m=json.loads(Path('projects/physqed/examples/typed/linked_adm_shifted_minkowski.json').read_text())
          linked=verify_linked_maxwell_positive_control(m['field_model'])
          assert linked['status']=='PASS_FIELD_AND_MAXWELL_POSITIVE_CONTROL__GR_BOUNDARY_LINK_OPEN'
          assert linked['all_18_Einstein_Maxwell_nodes_passed']
          assert not linked['constraint_energy_boundary_from_GR_evolution_proven']
          Path('/tmp/physqed-v12-receipts/maxwell_moving_wall.json').write_text(
              json.dumps(linked,indent=2,sort_keys=True)+'\n')
          PY
      - name: Standard GR/gauge/quantum/QFT/canonical and refusal cases
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12.py' -v
      - name: Independent standard-library arithmetic oracle
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_oracle.py' -v
      - name: Independent exact tensor 2-jet oracle
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_jet_oracle.py' -v
      - name: Coupled Einstein-Maxwell positive and negative controls
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_einstein_maxwell.py' -v
      - name: Spherical conservation trigonometric exactness and refusal
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_trig.py' -v
      - name: Typed coupled Einstein-Maxwell/ADM contracts (isolated SymPy processes)
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_valid_einstein_maxwell_full_linked_contract \
            test_wrong_coupling_fails_dynamics_but_not_geometry_bridge \
            test_wrong_cosmological_constant \
            test_declared_inconsistent_stress \
            test_nonclosed_declared_field_is_detected \
            test_wrong_claimed_constraints_refused \
            test_wrong_lapse_raises_not_green \
            test_wrong_signature_witness_refused \
            test_offshell_codazzi_bridge_nontrivial \
            test_matter_noether_bridge_offshell_maxwell \
            test_tampered_receipt_refused; do
            python -m unittest discover -s projects/physqed/tests \
              -p 'test_physics_v12_contract.py' -k "$test" -v
          done
      - name: Typed four-domain JSON compiler and refusal tests
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_typed_input.py' -v
      - name: Textbook typed input CLI positive and adversarial JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/physqed-v12-receipts/typed
          for stem in metric_minkowski lagrangian_free_scalar hamiltonian_oscillator gauge_maxwell; do
            PYTHONPATH=projects/physqed python -m v12.typed_cli \
              --input "projects/physqed/examples/typed/${stem}.json" \
              --output "/tmp/physqed-v12-receipts/typed/${stem}.json"
          done
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/metric_minkowski.json \
            --plan --output /tmp/physqed-v12-receipts/typed/minkowski_plan.json
          set +e
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/negative_nonflat_field.json \
            --output /tmp/physqed-v12-receipts/typed/negative_nonflat_field.json
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 2 ]; then echo "False flatness should fail with exit 2"; exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/physqed-v12-receipts/typed')
          for stem in ('metric_minkowski','lagrangian_free_scalar','hamiltonian_oscillator','gauge_maxwell'):
              r=json.loads((p/(stem+'.json')).read_text())
              assert r['status'].startswith('PASS_SCOPED_'), stem
              assert not r['physical_truth_proven']
          bad=json.loads((p/'negative_nonflat_field.json').read_text())
          assert bad['status']=='REJECTED_UNSATISFIED_PHYSICS_OBLIGATION'
          plan=json.loads((p/'minkowski_plan.json').read_text())
          assert plan['execution_status']=='NOT_EXECUTED'
          PY
      - name: Typed Einstein-Maxwell ADM 16-node bridge, unit and variance gates
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_flat_all_sixteen_linked \
            test_nonflat_electrovacuum_reissner_nordstrom \
            test_wrong_electric_source_fails_physics_after_type_pass \
            test_plan_exposes_sixteen_but_does_not_prove \
            test_wrong_covariant_index_variance_refused \
            test_wrong_tensor_rank_refused \
            test_missing_unit_system_refused \
            test_dimensionally_inconsistent_potential_refused \
            test_dimensionally_inconsistent_spherical_metric_refused \
            test_wrong_parameter_dimension_refused \
            test_nontrivial_trigonometric_argument_dimension_refused \
            test_nonzero_shift_refused_by_existing_ADM_backend \
            test_claimed_hamiltonian_false_but_dimension_correct \
            test_wrong_cosmological_constant_dimension_refused \
            test_tampered_linked_receipt_refused_by_full_replay; do
            python -m unittest discover -s projects/physqed/tests \
              -p 'test_physics_v12_typed_em_bridge.py' -k "$test" -v
          done
      - name: Typed Einstein-Maxwell CLI positive and refusal receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/physqed-v12-receipts/typed
          for stem in einstein_maxwell_flat einstein_maxwell_reissner_nordstrom; do
            PYTHONPATH=projects/physqed python -m v12.typed_cli \
              --input "projects/physqed/examples/typed/${stem}.json" \
              --output "/tmp/physqed-v12-receipts/typed/${stem}.json"
          done
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/einstein_maxwell_flat.json \
            --plan --output /tmp/physqed-v12-receipts/typed/einstein_maxwell_plan.json
          set +e
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/einstein_maxwell_inconsistent_flat.json \
            --output /tmp/physqed-v12-receipts/typed/einstein_maxwell_inconsistent_flat.json
          refusal=$?
          set -e
          if [ "$refusal" -ne 2 ]; then echo "Expected wrong Einstein-Maxwell source refusal"; exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/physqed-v12-receipts/typed')
          for stem in ('einstein_maxwell_flat', 'einstein_maxwell_reissner_nordstrom'):
              result=json.loads((root/(stem+'.json')).read_text())
              assert result['status']=='PASS_TYPED_EINSTEIN_MAXWELL_ADM__SCOPED'
              assert len(result['coupled_contract']['nodes'])==16
              assert len(result['tensor_index_signature_checks'])==5
              assert not result['global_theorem_proven']
          bad=json.loads((root/'einstein_maxwell_inconsistent_flat.json').read_text())
          assert bad['status']=='REJECTED_LINKED_PHYSICS_OBLIGATIONS'
          planned=json.loads((root/'einstein_maxwell_plan.json').read_text())
          assert planned['execution_status']=='NOT_EXECUTED'
          assert len(planned['obligations'])==16
          PY
      - name: Shifted ADM normal/momentum and off-shell Bianchi propagation
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            test_time_dependent_nonzero_shift_flat_solution \
            test_spatially_dependent_shift_offshell_bianchi \
            test_shifted_minkowski_with_spatial_shift_gradient \
            test_offshell_maxwell_stress_refuses_homogeneous_closure \
            test_invalid_negative_lapse_witness_refused \
            test_invalid_indefinite_spatial_witness_refused \
            test_wrong_shift_dimension_refused \
            test_spacetime_dependent_gravitational_coupling_refused \
            test_spacetime_dependent_cosmological_constant_refused \
            test_recompute_receipt_rejects_tampering; do
            python -m unittest discover -s projects/physqed/tests \
              -p test_physics_v12_adm_shift.py -k "$name" -v
          done
      - name: Typed shifted ADM unit and index gate regressions
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            test_time_dependent_shifted_minkowski_full_contract \
            test_offshell_shift_retains_bianchi_but_refuses_field_equations \
            test_shift_dimension_wrong_refused_before_equations \
            test_covariant_shift_signature_refused \
            test_shift_missing_declared_refused \
            test_wrong_spatial_metric_units_refused \
            test_wrong_shift_rank_refused \
            test_planning_is_not_execution \
            test_receipt_tampering_caught_by_recomputation; do
            python -m unittest discover -s projects/physqed/tests \
              -p test_physics_v12_typed_shift.py -k "$name" -v
          done
      - name: Typed shifted ADM CLI reproducible positives and refusals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/physqed-v12-receipts/shifted
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/einstein_maxwell_shifted_flat.json \
            --output /tmp/physqed-v12-receipts/shifted/flat.json
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/einstein_maxwell_shifted_flat.json \
            --plan --output /tmp/physqed-v12-receipts/shifted/plan.json
          set +e
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/einstein_maxwell_shifted_offshell.json \
            --output /tmp/physqed-v12-receipts/shifted/offshell.json
          offshell_code=$?
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/einstein_maxwell_shifted_invalid_dimension.json \
            --output /tmp/physqed-v12-receipts/shifted/invalid.json
          invalid_code=$?
          set -e
          test "$offshell_code" -eq 2
          test "$invalid_code" -eq 3
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/physqed-v12-receipts/shifted')
          good=json.loads((path/'flat.json').read_text())
          assert good['status']=='PASS_TYPED_SHIFTED_ADM__SCOPED'
          assert good['shifted_contract']['homogeneous_constraint_propagation_identities_passed']
          assert not good['global_constraint_propagation_theorem_proven']
          bad=json.loads((path/'offshell.json').read_text())
          assert bad['status']=='REJECTED_TYPED_SHIFTED_ADM'
          plan=json.loads((path/'plan.json').read_text())
          assert plan['execution_status']=='NOT_EXECUTED'
          assert len(plan['obligations'])==18
          PY
      - name: Reproducible standard-physics receipts
        run: |
          PYTHONPATH=projects/physqed python -m v12.benchmarks --out-dir /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python -m v12.contract_benchmark --out-dir /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python -m v12.coupled_benchmark \
            --output /tmp/physqed-v12-receipts/STD-GR-EM-RN-001.json \
            --negative-output /tmp/physqed-v12-receipts/STD-GR-EM-RN-NEG.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physqed-v12-standard-receipts
          path: /tmp/physqed-v12-receipts
          if-no-files-found: warn
      - name: Existing legacy engine regression
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_engine.py' -v
      - name: Compile all new Python modules
        run: |
          python -m compileall -q projects/physqed/v12

