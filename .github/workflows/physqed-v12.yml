name: PHYSQED v1.2 physics-backend certificates

on:
  push:
    paths:
      - "projects/physqed/v12/**"
      - "projects/physqed/tests/test_physics_v12*.py"
      - ".github/workflows/physqed-v12.yml"
  pull_request:
    paths:
      - "projects/physqed/v12/**"
      - "projects/physqed/tests/test_physics_v12*.py"
      - ".github/workflows/physqed-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-exact:
    name: Python 3.15.2 textbook checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Confirm interpreter (security-patched release)
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3,15,2), sys.version"
      - name: Syntax-check new backend before importing physics tests
        run: |
          python -m compileall -q projects/physqed/v12
          python -m compileall -q projects/physqed/tests/test_physics_v12*.py
      - name: Install exact-symbolic dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Standard GR/gauge/quantum/QFT/canonical and refusal cases
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12.py' -v
      - name: Independent standard-library arithmetic oracle
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_oracle.py' -v
      - name: Independent exact tensor 2-jet oracle
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_jet_oracle.py' -v
      - name: Coupled Einstein-Maxwell positive and negative controls
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_einstein_maxwell.py' -v
      - name: Spherical conservation trigonometric exactness and refusal
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_trig.py' -v
      - name: Typed coupled Einstein-Maxwell/ADM contracts (isolated SymPy processes)
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_valid_einstein_maxwell_full_linked_contract \
            test_wrong_coupling_fails_dynamics_but_not_geometry_bridge \
            test_wrong_cosmological_constant \
            test_declared_inconsistent_stress \
            test_nonclosed_declared_field_is_detected \
            test_wrong_claimed_constraints_refused \
            test_wrong_lapse_raises_not_green \
            test_wrong_signature_witness_refused \
            test_offshell_codazzi_bridge_nontrivial \
            test_matter_noether_bridge_offshell_maxwell \
            test_tampered_receipt_refused; do
            python -m unittest discover -s projects/physqed/tests \
              -p 'test_physics_v12_contract.py' -k "$test" -v
          done
      - name: Typed four-domain JSON compiler and refusal tests
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_physics_v12_typed_input.py' -v
      - name: Textbook typed input CLI positive and adversarial JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/physqed-v12-receipts/typed
          for stem in metric_minkowski lagrangian_free_scalar hamiltonian_oscillator gauge_maxwell; do
            PYTHONPATH=projects/physqed python -m v12.typed_cli \
              --input "projects/physqed/examples/typed/${stem}.json" \
              --output "/tmp/physqed-v12-receipts/typed/${stem}.json"
          done
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/metric_minkowski.json \
            --plan --output /tmp/physqed-v12-receipts/typed/minkowski_plan.json
          set +e
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/negative_nonflat_field.json \
            --output /tmp/physqed-v12-receipts/typed/negative_nonflat_field.json
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 2 ]; then echo "False flatness should fail with exit 2"; exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/physqed-v12-receipts/typed')
          for stem in ('metric_minkowski','lagrangian_free_scalar','hamiltonian_oscillator','gauge_maxwell'):
              r=json.loads((p/(stem+'.json')).read_text())
              assert r['status'].startswith('PASS_SCOPED_'), stem
              assert not r['physical_truth_proven']
          bad=json.loads((p/'negative_nonflat_field.json').read_text())
          assert bad['status']=='REJECTED_UNSATISFIED_PHYSICS_OBLIGATION'
          plan=json.loads((p/'minkowski_plan.json').read_text())
          assert plan['execution_status']=='NOT_EXECUTED'
          PY
      - name: Typed Einstein-Maxwell ADM 16-node bridge, unit and variance gates
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_flat_all_sixteen_linked \
            test_nonflat_electrovacuum_reissner_nordstrom \
            test_wrong_electric_source_fails_physics_after_type_pass \
            test_plan_exposes_sixteen_but_does_not_prove \
            test_wrong_covariant_index_variance_refused \
            test_wrong_tensor_rank_refused \
            test_missing_unit_system_refused \
            test_dimensionally_inconsistent_potential_refused \
            test_dimensionally_inconsistent_spherical_metric_refused \
            test_wrong_parameter_dimension_refused \
            test_nontrivial_trigonometric_argument_dimension_refused \
            test_nonzero_shift_refused_by_existing_ADM_backend \
            test_claimed_hamiltonian_false_but_dimension_correct \
            test_wrong_cosmological_constant_dimension_refused \
            test_tampered_linked_receipt_refused_by_full_replay; do
            python -m unittest discover -s projects/physqed/tests \
              -p 'test_physics_v12_typed_em_bridge.py' -k "$test" -v
          done
      - name: Typed Einstein-Maxwell CLI positive and refusal receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/physqed-v12-receipts/typed
          for stem in einstein_maxwell_flat einstein_maxwell_reissner_nordstrom; do
            PYTHONPATH=projects/physqed python -m v12.typed_cli \
              --input "projects/physqed/examples/typed/${stem}.json" \
              --output "/tmp/physqed-v12-receipts/typed/${stem}.json"
          done
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/einstein_maxwell_flat.json \
            --plan --output /tmp/physqed-v12-receipts/typed/einstein_maxwell_plan.json
          set +e
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/einstein_maxwell_inconsistent_flat.json \
            --output /tmp/physqed-v12-receipts/typed/einstein_maxwell_inconsistent_flat.json
          refusal=$?
          set -e
          if [ "$refusal" -ne 2 ]; then echo "Expected wrong Einstein-Maxwell source refusal"; exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/physqed-v12-receipts/typed')
          for stem in ('einstein_maxwell_flat', 'einstein_maxwell_reissner_nordstrom'):
              result=json.loads((root/(stem+'.json')).read_text())
              assert result['status']=='PASS_TYPED_EINSTEIN_MAXWELL_ADM__SCOPED'
              assert len(result['coupled_contract']['nodes'])==16
              assert len(result['tensor_index_signature_checks'])==5
              assert not result['global_theorem_proven']
          bad=json.loads((root/'einstein_maxwell_inconsistent_flat.json').read_text())
          assert bad['status']=='REJECTED_LINKED_PHYSICS_OBLIGATIONS'
          planned=json.loads((root/'einstein_maxwell_plan.json').read_text())
          assert planned['execution_status']=='NOT_EXECUTED'
          assert len(planned['obligations'])==16
          PY
      - name: Reproducible standard-physics receipts
        run: |
          PYTHONPATH=projects/physqed python -m v12.benchmarks --out-dir /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python -m v12.contract_benchmark --out-dir /tmp/physqed-v12-receipts
          PYTHONPATH=projects/physqed python -m v12.coupled_benchmark \
            --output /tmp/physqed-v12-receipts/STD-GR-EM-RN-001.json \
            --negative-output /tmp/physqed-v12-receipts/STD-GR-EM-RN-NEG.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physqed-v12-standard-receipts
          path: /tmp/physqed-v12-receipts
          if-no-files-found: warn
      - name: Existing legacy engine regression
        run: |
          python -m unittest discover -s projects/physqed/tests -p 'test_engine.py' -v
      - name: Compile all new Python modules
        run: |
          python -m compileall -q projects/physqed/v12

