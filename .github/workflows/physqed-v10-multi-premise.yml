name: PHYSQED v1.0 Independent 2-4 Premise Certificates
on:
  push:
    paths:
      - 'projects/physqed/**'
      - 'research/physqed-multi-premise-v10/**'
      - '.github/workflows/physqed-v10-multi-premise.yml'
  pull_request:
    paths:
      - 'projects/physqed/**'
      - 'research/physqed-multi-premise-v10/**'
      - '.github/workflows/physqed-v10-multi-premise.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-multi-premise-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned symbolic independent oracle
        run: python -m pip install sympy==1.14.0
      - name: Run all inherited and 12 new Python regression tests
        run: python -m unittest discover -s projects/physqed/tests -v
      - name: Run 880-case exact 2-4 premise PHYSQED benchmark
        run: python projects/physqed/benchmarks/multi_premise_v10.py /tmp/physqed-v10-results.json
      - name: Run independently written 880-case SymPy and Groebner oracle
        run: python research/physqed-multi-premise-v10/independent_oracle.py /tmp/physqed-v10-oracle.json
      - name: Require exact benchmark and independent oracle verdict agreement
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/physqed-v10-results.json'))
          b=json.load(open('/tmp/physqed-v10-oracle.json'))
          assert (a['total'],a['correct'],a['positives'])==(880,880,80)
          assert a['false_accepts']==a['false_refusals']==0
          assert (b['total'],b['correct'],b['positives'])==(880,880,80)
          assert not a['lean_kernel_confirmed'] and not a['empirical_physics_verified']
          assert not b['physical_truth_certified'] and not b['lean_kernel_verified']
          PY
      - name: Keep reusable engine independent of paper data
        run: python projects/physqed/standalone_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: physqed-v10-multipremise-exact-scoped
          path: |
            /tmp/physqed-v10-results.json
            /tmp/physqed-v10-oracle.json
          if-no-files-found: error
  lean-multi-premise-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib
        working-directory: projects/physqed
        run: |
          lake update
          lake exe cache get
      - name: Compile 3 and 4 premise Lean soundness certificates
        working-directory: projects/physqed
        run: lake env lean lean/MultiPremise.lean
      - name: Reject admitted proofs and local axioms
        working-directory: projects/physqed
        run: |
          if grep -En '^\s*(sorry|admit|axiom)\b|:=\s*(sorry|admit)\b' lean/MultiPremise.lean; then
            echo "Forbidden unchecked proof"; exit 1
          fi
