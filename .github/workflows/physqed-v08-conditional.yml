name: PHYSQED v0.8 Controlled Conditional Claims
on:
  push:
    paths:
      - 'projects/physqed/**'
      - 'research/physqed-conditional-v08/**'
      - '.github/workflows/physqed-v08-conditional.yml'
  pull_request:
    paths:
      - 'projects/physqed/**'
      - 'research/physqed-conditional-v08/**'
      - '.github/workflows/physqed-v08-conditional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-conditional-and-negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned independent symbolic oracle dependency
        run: python -m pip install sympy==1.14.0
      - name: Run complete existing and new PHYSQED regression tests
        run: python -m unittest discover -s projects/physqed/tests -v
      - name: Run 560 synthetic conditional / scope challenges
        run: python projects/physqed/benchmarks/conditional_v08.py /tmp/conditional_560.json
      - name: Reproduce 560 mathematical verdicts with independent SymPy oracle
        run: python research/physqed-conditional-v08/independent_oracle.py /tmp/conditional_independent.json
      - name: Run 300 malformed-contract refusals
        run: python research/physqed-conditional-v08/fuzz_refusal.py /tmp/conditional_malformed_300.json
      - name: Explicit refusal of false physical or Lean certification
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/conditional_560.json'))
          b=json.load(open('/tmp/conditional_independent.json'))
          assert a['cases']==a['correct']==560
          assert a['false_accepted']==a['false_refused']==0
          assert a['physical_truth_verified'] is False
          assert a['competitor_tests_run'] is False
          assert b['total']==b['agreement']==560
          assert b['formal_lean_compilation'] is False
          PY
      - name: Check generic engine remains free of paper-specific solvers
        run: python projects/physqed/standalone_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: physqed-v08-synthetic-scope-and-independent-oracle
          path: |
            /tmp/conditional_560.json
            /tmp/conditional_independent.json
            /tmp/conditional_malformed_300.json
          if-no-files-found: error
