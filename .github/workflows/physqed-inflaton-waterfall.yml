name: PHYSQED inflaton waterfall research benchmark

on:
  push:
    paths:
      - "projects/physqed/research/inflaton_waterfall_dynamics.py"
      - "projects/physqed/research/inflaton_waterfall_next_test.py"
      - "projects/physqed/research/inflaton_two_field_ms.py"
      - "projects/physqed/research/stochastic_waterfall_deltaN.py"
      - "projects/physqed/research/stochastic_waterfall_bias_gate.py"
      - "projects/physqed/research/inflaton_exact_spinodal.py"
      - "projects/physqed/examples/typed/inflaton_waterfall_minisuperspace.json"
      - "projects/physqed/tests/test_inflaton_waterfall_typed.py"
      - ".github/workflows/physqed-inflaton-waterfall.yml"
  pull_request:
    paths:
      - "projects/physqed/research/inflaton_waterfall_dynamics.py"
      - "projects/physqed/research/inflaton_waterfall_next_test.py"
      - "projects/physqed/research/inflaton_two_field_ms.py"
      - "projects/physqed/research/stochastic_waterfall_deltaN.py"
      - "projects/physqed/research/stochastic_waterfall_bias_gate.py"
      - "projects/physqed/research/inflaton_exact_spinodal.py"
      - "projects/physqed/examples/typed/inflaton_waterfall_minisuperspace.json"
      - "projects/physqed/tests/test_inflaton_waterfall_typed.py"
      - ".github/workflows/physqed-inflaton-waterfall.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-minisuperspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned SymPy
        run: python -m pip install sympy==1.14.0
      - name: Exact typed-input positive, refusal, replay and rational gates
        run: python -m unittest discover -s projects/physqed/tests -p "test_inflaton_waterfall_typed.py" -v
      - name: Produce PHYSQED typed receipt
        run: |
          PYTHONPATH=projects/physqed python -m v12.typed_cli \
            --input projects/physqed/examples/typed/inflaton_waterfall_minisuperspace.json \
            --output inflaton_typed_receipt.json
      - name: Exact two-field spinodal and pivot-displacement no-overlap certificate
        run: python projects/physqed/research/inflaton_exact_spinodal.py
      - uses: actions/upload-artifact@v4
        with:
          name: inflaton-exact-spinodal-certificate
          path: inflaton_spinodal_exact_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: inflaton-typed-symbolic-receipt
          path: inflaton_typed_receipt.json

  conditional-frw-dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1
      - name: Run conservative control and two phenomenological decay cases
        run: |
          python projects/physqed/research/inflaton_waterfall_dynamics.py \
            --post-duration 55 --output inflaton_dynamics_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: inflaton-numerical-benchmark-receipt
          path: inflaton_dynamics_receipt.json
      - name: Next test, reselect pivot relative to the first actual inflationary exit
        run: |
          python projects/physqed/research/inflaton_waterfall_next_test.py \
            --output inflaton_next_test_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: inflaton-next-test-actual-exit-receipt
          path: inflaton_next_test_receipt.json
      - name: Gauge-invariant two-field scalar/tensor mode check
        run: |
          python projects/physqed/research/inflaton_two_field_ms.py \
            --before 5 --output inflaton_ms_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: inflaton-gauge-invariant-modes
          path: inflaton_ms_receipt.json
      - name: Scoped Gaussian-seed separate-universe stochastic delta-N regression
        run: |
          python projects/physqed/research/stochastic_waterfall_deltaN.py \
            --n 96 --output stochastic_waterfall_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: inflaton-stochastic-deltaN-receipt
          path: stochastic_waterfall_receipt.json
      - name: Bias-induced metastable vacuum and opposite basin negative controls
        run: python projects/physqed/research/stochastic_waterfall_bias_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: inflaton-stochastic-bias-gate
          path: inflaton_bias_gate_receipt.json
