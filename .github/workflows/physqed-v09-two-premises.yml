name: PHYSQED v0.9 Two Independent Premises
on:
  push:
    paths:
      - 'projects/physqed/**'
      - 'research/physqed-two-premise-v09/**'
      - '.github/workflows/physqed-v09-two-premises.yml'
  pull_request:
    paths:
      - 'projects/physqed/**'
      - 'research/physqed-two-premise-v09/**'
      - '.github/workflows/physqed-v09-two-premises.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-two-premise-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned independent oracle dependency
        run: python -m pip install sympy==1.14.0
      - name: Complete inherited and new Python test suite
        run: python -m unittest discover -s projects/physqed/tests -v
      - name: Run 540-case exact two-premise benchmark
        run: python projects/physqed/benchmarks/two_premise_v09.py /tmp/physqed-v09-results.json
      - name: Independently audit 540 verdicts with SymPy AST and SI units
        run: python research/physqed-two-premise-v09/independent_oracle.py /tmp/physqed-v09-oracle.json
      - name: Assert fail-closed scope and correct acceptance counts
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/physqed-v09-results.json'))
          b=json.load(open('/tmp/physqed-v09-oracle.json'))
          assert (a['total'],a['correct'],a['accepts'])==(540,540,60)
          assert a['false_accepts']==a['false_refusals']==0
          assert not a['lean_compilation_confirmed'] and not a['external_competitor_comparison']
          assert (b['total'],b['agreements'])==(540,540)
          assert b['physical_truth_certified'] is False
          assert b['independently_annotated_external_source'] is False
          PY
      - name: Keep general engine manuscript independent
        run: python projects/physqed/standalone_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: physqed-v09-two-premise-scoped-evidence
          path: |
            /tmp/physqed-v09-results.json
            /tmp/physqed-v09-oracle.json
          if-no-files-found: error
  lean-two-premise-soundness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Lean Mathlib cache
        working-directory: projects/physqed
        run: |
          lake update
          lake exe cache get
      - name: Compile generic two-premise soundness theorem and independent example
        working-directory: projects/physqed
        run: lake env lean lean/TwoPremise.lean
      - name: Ban admitted proofs and local axioms
        working-directory: projects/physqed
        run: |
          if grep -En '^\s*(sorry|admit|axiom)\b|:=\s*(sorry|admit)\b' lean/TwoPremise.lean; then
            echo "Forbidden admitted claim"; exit 1;
          fi
