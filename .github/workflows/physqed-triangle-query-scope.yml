name: PHYSQED exact triangle-query scope controls
on:
  push:
    paths:
      - 'projects/physqed/tests/test_triangle_query_scope.py'
      - '.github/workflows/physqed-triangle-query-scope.yml'
  pull_request:
    paths:
      - 'projects/physqed/tests/test_triangle_query_scope.py'
      - '.github/workflows/physqed-triangle-query-scope.yml'
permissions:
  contents: read
jobs:
  exact-triangle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Exact Boolean and refusal tests
        run: python -m unittest discover -s projects/physqed/tests -p 'test_triangle_query_scope.py' -v
