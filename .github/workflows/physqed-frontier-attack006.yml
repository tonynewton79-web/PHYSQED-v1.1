name: PHYSQED Frontier Attack006 Rigorous Annulus
on:
  pull_request:
    paths:
      - "research/frontier-physics-attack006/**"
      - ".github/workflows/physqed-frontier-attack006.yml"
  workflow_dispatch:
jobs:
  spherical-constraints-and-interval-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin symbolic engine
        run: python -m pip install "sympy==1.14.0"
      - name: Exact full spherical ADM variation and linear backreaction
        run: python research/frontier-physics-attack006/attack006_radial.py
      - name: Independent rational interval nonlinear residual certificate
        run: python research/frontier-physics-attack006/attack006_interval_certificate.py
