name: PHYSQED 0.2 Physics Statement Compiler
on:
  push:
    paths:
      - "projects/physqed/**"
      - ".github/workflows/physqed-v02.yml"
  pull_request:
    paths:
      - "projects/physqed/**"
      - ".github/workflows/physqed-v02.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned symbolic test dependency
        run: python -m pip install sympy==1.14.0
      - name: Unit and adversarial regression suite
        run: python -m unittest discover -s projects/physqed/tests -v
      - name: Independent symbolic backend
        run: |
          python -m pip install sympy==1.14.0
          python projects/physqed/audit_sympy.py
      - name: Regenerate and compare Lean proof bytes
        run: |
          python projects/physqed/compiler.py projects/physqed/fixtures/oscillator_contract.json --output /tmp/physqed-report.json --lean-output /tmp/CompiledOscillator.lean
          cmp projects/physqed/lean/CompiledOscillator.lean /tmp/CompiledOscillator.lean
      - name: Adversarial fixtures must be rejected
        shell: bash
        run: |
          if python projects/physqed/compiler.py projects/physqed/fixtures/oscillator_bad_witness.json >/dev/null; then exit 1; fi
          if python projects/physqed/compiler.py projects/physqed/fixtures/oscillator_wrong_sign.json >/dev/null; then exit 1; fi
  lean-kernel-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile pinned generated Lean theorem
        working-directory: projects/physqed
        run: |
          lake update
          lake exe cache get
          lake env lean lean/CompiledOscillator.lean
      - name: Fail if source includes admitted proofs or local axioms
        working-directory: projects/physqed
        run: |
          if grep -E '(sorry|admit|^axiom )' lean/CompiledOscillator.lean; then exit 1; fi
