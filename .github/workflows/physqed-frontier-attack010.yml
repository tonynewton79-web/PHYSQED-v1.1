name: PHYSQED Frontier Attack010 Exact Massless Exterior
on:
  pull_request:
    paths:
      - "research/frontier-physics-attack010/**"
      - ".github/workflows/physqed-frontier-attack010.yml"
  workflow_dispatch:
jobs:
  exact-exterior-banach-and-formal-divergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact symbolic and high precision dependencies
        run: python -m pip install "sympy==1.14.0" "mpmath==1.3.0"
      - name: Fraction-only exact exterior Banach and horizon-mismatch proof
        run: python research/frontier-physics-attack010/attack010_exterior_banach.py
      - name: Independently derive Green source identities and C2 Helmholtz
        run: python research/frontier-physics-attack010/attack010_symbolic_replay.py
      - name: Factorial asymptotic recurrence and integral replay
        run: python research/frontier-physics-attack010/attack010_helmholtz.py
