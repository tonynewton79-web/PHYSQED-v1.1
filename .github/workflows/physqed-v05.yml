name: PHYSQED 0.5 standalone engine regression
on:
  push:
    paths:
      - 'projects/physqed/**'
      - '.github/workflows/physqed-v05.yml'
  pull_request:
    paths:
      - 'projects/physqed/**'
      - '.github/workflows/physqed-v05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-generic-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The inherited conservation tests import SymPy; GitHub runners do not ship it.
      - name: Install pinned symbolic dependency
        run: python -m pip install sympy==1.14.0
      - name: Run all existing and new negative-control tests
        run: python -m unittest discover -s projects/physqed/tests -v
      - name: Run independently implemented synthetic numerical audit
        run: python projects/physqed/independent_v05_audit.py
      - name: Produce UNVERIFIED proof-status example with locked source hashes
        run: |
          python projects/physqed/method_gate.py \
            --manifest projects/physqed/fixtures/generic_method_fixture.json \
            --source-root projects/physqed --output /tmp/physqed-generic-report.json
          python -c 'import json; x=json.load(open("/tmp/physqed-generic-report.json")); assert x["method_source_hashes_verified"] and not x["lean_kernel_verified"] and not x["empirical_validation_verified"]'
      - name: Check no paper-specific files in generic release
        run: python projects/physqed/standalone_guard.py
